name: P95 Stage 2 Android UI Audio Quran Audit (read only)
on:
  push:
    branches: [release/p95-stage2-ui-audio-audit-safe]
  workflow_dispatch:
concurrency:
  group: p95-stage2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download exactly P95 VC119 successful Safe Source
        uses: actions/download-artifact@v4
        with:
          name: AB-Khatma-P95-VC119-COMPLETE-SAFE-SOURCE
          run-id: 39270578361
          github-token: ${{ github.token }}
          path: baseline
      - name: Download proven P95 physical-emulator snapshots
        uses: actions/download-artifact@v4
        with:
          name: AB-Khatma-P95-VC119-NATIVE-DEVICE-RESULTS
          run-id: 39270578361
          github-token: ${{ github.token }}
          path: native
      - name: Verify source ZIP and unpack in isolated runner
        run: |
          set -euo pipefail
          test -f baseline/AB_Khatma_P95_VC119_SAFE_SOURCE.zip
          unzip -tq baseline/AB_Khatma_P95_VC119_SAFE_SOURCE.zip | tail -n 1
          mkdir -p extracted
          unzip -q baseline/AB_Khatma_P95_VC119_SAFE_SOURCE.zip -d extracted
          test -f extracted/AB_Khatma_P95_VC119_SAFE_SOURCE/app/build.gradle.kts
      - name: Audit all Kotlin/UI text, image pages, sounds and manifest without changing source
        run: |
          set -euo pipefail
          python3 -m py_compile tools/p95_stage2_audit.py
          python3 tools/p95_stage2_audit.py \
            --source extracted/AB_Khatma_P95_VC119_SAFE_SOURCE \
            --screenshots native \
            --output reports
      - name: Upload comprehensive evidence including detailed line references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P95-STAGE2-UI-AUDIO-AUDIT
          path: reports/*
          if-no-files-found: warn
          retention-days: 30

  small-screen-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download P95 already-tested CI-signed test APKs (not user release APK)
        uses: actions/download-artifact@v4
        with:
          name: AB-Khatma-P95-VC119-CI-TEST-APKS
          run-id: 39270578361
          github-token: ${{ github.token }}
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            adb install -r test-apks/p94-ci-app.apk
            adb install -r test-apks/p94-ci-test.apk
            adb shell pm grant com.ab.khatma.preview android.permission.POST_NOTIFICATIONS
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.4
            adb shell wm size
            adb shell settings get system font_scale
            adb shell am instrument -w -r -e class com.ab.khatma.guide.P94LayoutNavigationDeviceTest,com.ab.khatma.guide.P85GuideUiTest,com.ab.khatma.guide.P88IbtehalDeviceTest,com.ab.khatma.guide.P85ReaderDeviceTest com.ab.khatma.preview.test/androidx.test.runner.AndroidJUnitRunner > small-screen-results.txt
            cat small-screen-results.txt
            grep -E '^OK \([0-9]+ tests?\)' small-screen-results.txt
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' small-screen-results.txt
            mkdir -p small-screenshots
            for f in p88-ibtehal-categories.png p88-ibtehal-tracks.png p88-ibtehal-detail.png p85-guide-first.png p85-guide-next.png p85-reader-187.png; do
              adb exec-out run-as com.ab.khatma.preview cat files/$f > small-screenshots/$f || rm -f small-screenshots/$f
            done
      - name: Save compact-screen and enlarged Arabic-font evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P95-STAGE2-SMALL-SCREEN-UI
          path: |
            small-screen-results.txt
            small-screenshots/*
          retention-days: 30
          if-no-files-found: warn
