name: P31 Khatma Distribution - Android VC47
on:
  push:
    branches: [release/p31-khatma-distribution-v47]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android SDK 36
        run: |
          TOOL=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$TOOL"
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare downloader
        run: |
          npm install --prefix /tmp/browser playwright
          /tmp/browser/node_modules/.bin/playwright install chromium
      - name: Download exact P31 Safe Source
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/EoeFoJT4E5Jd',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('p31_safe_source.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo 'fbbdbe4fc28a483044cd7778d0700645c03e9366df8ad9ba955bdf6dda2e9ae3  p31_safe_source.zip' | sha256sum -c -
          mkdir -p src
          unzip -q p31_safe_source.zip -d src
      - name: Download existing Android Firebase public client configuration
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/LbThokuWeZ0M',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('public_config.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '47975628483fae63d69b84464f3a01349fb7560ff91744c54f6c4d746e9b607c  public_config.zip' | sha256sum -c -
          mkdir -p configs
          unzip -q public_config.zip -d configs
      - name: Verify P31 source and compile APK
        working-directory: src/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          # Historical verify_project.py is pinned to VC45; P31 has a dedicated VC47 check.
          python3 tools/check_p31_distribution.py
          grep -q 'versionCode = 47' app/build.gradle.kts
          set -a
          . ../../configs/android_client_config.txt
          set +a
          gradle --no-daemon --stacktrace :app:assembleDebug \
            -PKHATMA_FIREBASE_API_KEY="$KHATMA_FIREBASE_API_KEY" \
            -PKHATMA_FIREBASE_APP_ID="$KHATMA_FIREBASE_APP_ID" \
            -PKHATMA_GOOGLE_WEB_CLIENT_ID="$KHATMA_GOOGLE_WEB_CLIENT_ID" \
            -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app" \
            -PKHATMA_V2_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app"
      - name: Collect unsigned APK and local-signing tools
        run: |
          mkdir -p unsigned_build
          find src/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/build/outputs/apk/debug -type f -name '*.apk' -print -exec cp {} unsigned_build/app-debug-unsigned.apk \;
          test -s unsigned_build/app-debug-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" unsigned_build/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" unsigned_build/zipalign
          chmod +x unsigned_build/zipalign
          sha256sum unsigned_build/*
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P31-VC46-UNSIGNED-LOCAL-SIGNING
          path: unsigned_build/*
          if-no-files-found: error
          retention-days: 7
