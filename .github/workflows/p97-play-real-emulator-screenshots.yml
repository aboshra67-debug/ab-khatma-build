name: P97 Play authentic emulator screenshots
on:
  push:
    branches: [tools/p97-offline-signing-kit]
    paths: [.github/workflows/p97-play-real-emulator-screenshots.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Prepare Android Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pinned P97 CI binaries, no original signing key
        uses: actions/download-artifact@v4
        with:
          name: AB-Khatma-P97-VC121-CI-TEST-APKS
          run-id: 39290967444
          github-token: ${{ github.token }}
          path: ci_tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real app component screenshot tests and pull images
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            mkdir -p screen_images
            adb install -r ci_tests/p97-ci-app.apk
            adb install -r ci_tests/p97-ci-test.apk
            adb shell am instrument -w -r -e class com.ab.khatma.guide.P85ReaderDeviceTest,com.ab.khatma.guide.P88IbtehalDeviceTest com.ab.khatma.preview.test/androidx.test.runner.AndroidJUnitRunner > screen_tests.txt
            cat screen_tests.txt
            grep -E '^OK \([0-9]+ tests?\)' screen_tests.txt
            for name in p85-reader-187.png p85-reader-187-reading.png p85-reader-604.png p88-ibtehal-categories.png p88-ibtehal-tracks.png p88-ibtehal-detail.png; do
              adb exec-out run-as com.ab.khatma.preview cat files/"$name" > screen_images/"$name" || true
              if test -s screen_images/"$name"; then
                file screen_images/"$name"
              else
                rm -f screen_images/"$name"
                echo "WARNING: not exported: $name"
              fi
            done
            adb shell am force-stop com.ab.khatma.preview || true
            adb shell monkey -p com.ab.khatma.preview 1 || true
            sleep 10
            adb exec-out screencap -p > screen_images/app-entry-emulator.png
            file screen_images/app-entry-emulator.png
      - name: Upload screenshot evidence and test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AB-Khatma-P97-VC121-AUTHENTIC-EMULATOR-SCREENSHOTS
          path: |
            screen_images/*.png
            screen_tests.txt
          retention-days: 30
          if-no-files-found: warn
