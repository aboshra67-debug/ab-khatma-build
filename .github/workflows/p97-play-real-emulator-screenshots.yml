name: P97 Play authentic emulator screenshots
on:
  push:
    branches: [tools/p97-offline-signing-kit]
    paths: [.github/workflows/p97-play-real-emulator-screenshots.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Record screenshot workflow run ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/P97_SCREENSHOT_CAPTURE_RUN_ID.txt?ref=${GITHUB_REF_NAME}" --jq '.sha')"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/P97_SCREENSHOT_CAPTURE_RUN_ID.txt" \
            -f message="ci(play): record screenshot workflow run ID" \
            -f sha="${existing_sha}" \
            -f content="$(printf '%s' "${GITHUB_RUN_ID}" | base64 -w0)" \
            -f branch="${GITHUB_REF_NAME}"
      - name: Prepare Android Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pinned P97 CI binaries, no original signing key
        uses: actions/download-artifact@v4
        with:
          name: AB-Khatma-P97-VC121-CI-TEST-APKS
          run-id: 39290967444
          github-token: ${{ github.token }}
          path: ci_tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real app component screenshot tests and pull images
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/p97_capture_screen_images.sh
      - name: Upload screenshot evidence and test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AB-Khatma-P97-VC121-AUTHENTIC-EMULATOR-SCREENSHOTS
          path: |
            screen_images/*.png
            screen_tests.txt
          retention-days: 30
          if-no-files-found: warn
