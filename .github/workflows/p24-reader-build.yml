name: P24 Page Reader Build
on:
  push:
    branches: [release/p24-page-next-surah-v40]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Environment check
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "P24 Android build environment ready"
