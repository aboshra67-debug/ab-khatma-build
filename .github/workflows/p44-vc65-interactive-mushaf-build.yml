name: P44 VC65 Interactive Quran Pen APK and Play AAB
on:
  push:
    branches: [release/p44-vc65-interactive-mushaf]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android SDK 36
        run: |
          TOOL=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$TOOL"
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare restricted CI source downloader
        run: |
          npm install --prefix /tmp/browser playwright
          /tmp/browser/node_modules/.bin/playwright install chromium
      - name: Download proven P43 baseline including original and colored Quran pages
        uses: actions/download-artifact@v4
        with:
          name: AB-Khatma-P43-VC64-FULL-SAFE-SOURCE
          run-id: 38168659914
          github-token: ${{ github.token }}
          repository: aboshra67-debug/ab-khatma-build
          path: baseline
      - name: Extract exact P43 complete Safe Source
        run: |
          test -s baseline/AB_Khatma_P43_VC64_COMPLETE_SAFE_SOURCE.zip
          unzip -q baseline/AB_Khatma_P43_VC64_COMPLETE_SAFE_SOURCE.zip -d src
          test -d src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
      - name: Fetch pinned P44 add-only patch without private signing information
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/fhMI4l09Mw0P',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('p44-patchkit.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '1cfe9a3b3a4c9551d22e6220fd3039e95c51beaf8b738f249b8a169f372e7d12  p44-patchkit.zip' | sha256sum -c -
          unzip -q p44-patchkit.zip -d patchkit
      - name: Download same trusted Firebase public client settings (unchanged)
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/nBo1EY9iX-PP',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('public_config.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '91fb83b2e7c315232e7f670074762fb7e0d22e06cc19da3cbea3b82cf501c411  public_config.zip' | sha256sum -c -
          mkdir -p configs
          unzip -q public_config.zip -d configs
      - name: Apply P44 patch safely to P43; validate both 604-page editions
        run: |
          cd src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          patch --batch --forward -p1 < "$GITHUB_WORKSPACE/patchkit/P44_SAFE_PATCH.diff"
          cp "$GITHUB_WORKSPACE/patchkit/P44MushafInk.kt" app/src/main/java/com/ab/khatma/ui/screens/P44MushafInk.kt
          cp "$GITHUB_WORKSPACE/patchkit/P44_SAFE_PATCH_README_AR.txt" .
          test "$(find app/src/main/assets/quran_pages -name '*.webp' | wc -l)" -eq 604
          test "$(find app/src/main/assets/quran_pages_colored -name '*.webp' | wc -l)" -eq 604
          grep -q 'versionCode = 65' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".preview"' app/build.gradle.kts
          grep -q 'P44InkOverlay(' app/src/main/java/com/ab/khatma/ui/screens/P41OfflineMushafPage.kt
          grep -q 'p44_mushaf_annotations' app/src/main/java/com/ab/khatma/ui/screens/P44MushafInk.kt
          test ! -e app/src/main/assets/quran_pages/000.webp
          ! find . -type f \( -name '*.p12' -o -name '*.jks' -o -name '*.keystore' \) | grep .
          echo 'P44 safe patch and full Quran image checks PASS'
      - name: Build unsigned preview APK and Play AAB
        working-directory: src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
        run: |
          set -a
          . ../../configs/android_client_config.txt
          set +a
          gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease \
            -PKHATMA_FIREBASE_API_KEY="$KHATMA_FIREBASE_API_KEY" \
            -PKHATMA_FIREBASE_APP_ID="$KHATMA_FIREBASE_APP_ID" \
            -PKHATMA_GOOGLE_WEB_CLIENT_ID="$KHATMA_GOOGLE_WEB_CLIENT_ID" \
            -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app" \
            -PKHATMA_V2_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app"
      - name: Collect unsigned artifacts for local original signing
        run: |
          mkdir -p unsigned_build
          APK_PATH=$(find src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          AAB_PATH=$(find src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          test -n "$APK_PATH" && test -n "$AAB_PATH"
          cp "$APK_PATH" unsigned_build/P44_VC65_UNSIGNED.apk
          cp "$AAB_PATH" unsigned_build/P44_VC65_UNSIGNED_PLAY.aab
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" unsigned_build/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" unsigned_build/zipalign
          chmod +x unsigned_build/zipalign
          sha256sum unsigned_build/P43*
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P44-VC65-UNSIGNED-LOCAL-SIGNING
          path: unsigned_build/*
          if-no-files-found: error
          retention-days: 7
      - name: Archive complete P43 safe source with offline Quran
        run: |
          cd src
          zip -q -r -9 ../AB_Khatma_P44_VC65_COMPLETE_SAFE_SOURCE.zip AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE \
            -x '*/build/*' '*/.gradle/*' '*.p12' '*.jks' '*.keystore' '*.pyc' '*/__pycache__/*'
          unzip -t -q ../AB_Khatma_P44_VC65_COMPLETE_SAFE_SOURCE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P43-VC64-FULL-SAFE-SOURCE
          path: AB_Khatma_P44_VC65_COMPLETE_SAFE_SOURCE.zip
          if-no-files-found: error
          retention-days: 7
