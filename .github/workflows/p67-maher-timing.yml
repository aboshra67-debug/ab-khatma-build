name: P67 Maher verse joins (one-time data build)
on:
  push:
    branches: [tools/p67-maher-timing]
permissions:
  contents: write
jobs:
  joins:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet numpy
      - name: Find where each Maher verse file already holds the start of the next verse
        run: |
          DEBUG_PAIRS="1:6 1:5 2:5 2:6 112:1" python3 p67/p67_overlap.py MaherAlMuaiqly128kbps maher_joins.json $(cat p67/surahs_to_align.txt)
          sha256sum maher_joins.json | tee maher_joins.json.sha256
          python3 - <<'PY'
          import json
          r=json.load(open('maher_joins.json.report.json'))
          print('::notice::joined %d doubtful %d surahs %d' % (sum(x['joined'] for x in r), sum(x['doubtful'] for x in r), len(r)))
          PY
      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=maher-joins-v1
          if [ "$(wc -w < p67/surahs_to_align.txt)" -lt 114 ]; then TAG=maher-joins-debug; fi
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Maher Al-Muaiqly verse joins v1" \
            --notes "For each EveryAyah MaherAlMuaiqly128kbps verse: the time (ms) where the file already continues into the next verse (وصل). 0 = play the whole file." \
            maher_joins.json maher_joins.json.sha256 maher_joins.json.report.json maher_joins.json.debug.txt
