name: Build AB Khatma V0.10 Professional Quran APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract stable V0.8 core
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE.zip -d extracted

      - name: Apply V0.9 Quran Husary patch
        run: |
          cat v0_9/chunks/part00.b64 \
              v0_9/chunks/part01.b64 \
              v0_9/chunks/part02.b64 \
              v0_9/chunks/part03.b64 \
              v0_9/chunks/part04.b64 > v0_9/patch_v09.b64
          base64 -d v0_9/patch_v09.b64 > v0_9/patch_v09.zip
          unzip -t v0_9/patch_v09.zip
          unzip -o -q v0_9/patch_v09.zip -d extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE

      - name: Apply V0.10 professional Quran patch
        run: |
          cat v0_10/chunks/part00.b64 \
              v0_10/chunks/part01.b64 \
              v0_10/chunks/part02.b64 \
              v0_10/chunks/part03.b64 > v0_10/patch_head.b64
          base64 -d v0_10/patch_head.b64 > v0_10/patch_v010.zip
          cat v0_10/bin/part04.bin \
              v0_10/bin/part05.bin \
              v0_10/bin/part06.bin >> v0_10/patch_v010.zip
          base64 -d v0_10/chunks/part07.b64 >> v0_10/patch_v010.zip
          unzip -t v0_10/patch_v010.zip
          unzip -o -q v0_10/patch_v010.zip -d extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Preserve HomeScreen Compose import
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ab/khatma/ui/screens/HomeScreen.kt')
          s = p.read_text(encoding='utf-8')
          imp = 'import androidx.compose.runtime.CompositionLocalProvider\n'
          if imp not in s:
              anchor = 'import androidx.compose.runtime.Composable\n'
              if anchor not in s:
                  raise SystemExit('Composable import anchor not found')
              s = s.replace(anchor, imp + anchor, 1)
              p.write_text(s, encoding='utf-8')
          print('CompositionLocalProvider import ready')
          PY

      - name: Fix QuranEnc keys and Husary Muallim source
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/fetch_quran_content.py')
          s = p.read_text(encoding='utf-8')

          old = '''mean_item, mean_key = find_resource("معاني الكلمات")
          tafsir_item, tafsir_key = find_resource("التفسير الميسر")'''
          new = '''def resource_by_key(key: str, fallback_title: str):
              for item in catalog:
                  if str(item_key(item) or "") == key:
                      return item, key
              return {"key": key, "title": fallback_title, "version": ""}, key

          mean_item, mean_key = resource_by_key("arabic_seraj", "اللغة العربية - معاني الكلمات")
          tafsir_item, tafsir_key = resource_by_key("arabic_moyassar", "اللغة العربية - التفسير الميسر")'''
          if old not in s:
              raise SystemExit('QuranEnc resource lookup block not found')
          s = s.replace(old, new, 1)

          start = s.index('print("Discovering Mahmoud Khalil Al-Husary recitation on EveryAyah...")')
          end = s.index('audio_cfg = {', start)
          fixed_audio = '''print("Using Mahmoud Khalil Al-Husary Muallim 128kbps on EveryAyah...")
          rec_name = "Mahmoud Khalil Al-Husary - Muallim 128kbps"
          subfolder = "Husary_Muallim_128kbps"

          test_url = f"https://everyayah.com/data/{subfolder}/001001.mp3"
          req = urllib.request.Request(test_url, headers={"User-Agent": UA, "Range": "bytes=0-32"})
          with urllib.request.urlopen(req, timeout=30) as r:
              if r.status not in (200, 206):
                  raise RuntimeError(f"Al-Husary test audio failed: HTTP {r.status}")

          '''
          s = s[:start] + fixed_audio + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Pinned QuranEnc keys: arabic_seraj + arabic_moyassar')
          print('Pinned Husary source: Husary_Muallim_128kbps')
          PY

      - name: Fetch verified Quran content and Husary source
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 tools/fetch_quran_content.py

      - name: Verify V0.10 source
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 tools/verify_project.py
          test -s app/src/main/assets/quran/quran-uthmani.json
          test -s app/src/main/assets/quran/quran-word-meanings.json
          test -s app/src/main/assets/quran/quran-moyassar.json
          test -s app/src/main/assets/quran/husary-audio.json

      - name: Make V0.10 install-safe beside existing app
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          old = 'applicationId = "com.ab.khatma"'
          new = 'applicationId = "com.ab.khatma.v10preview"'
          if old not in s:
              raise SystemExit('applicationId anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Install-safe applicationId: com.ab.khatma.v10preview')
          PY

      - name: Build V0.10 Install Safe with Railway Server
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          gradle --no-daemon clean :app:assembleDebug \
            -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app"

      - name: Verify APK signature
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Check APK exists
        run: |
          test -f extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp \
            extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/build/outputs/apk/debug/app-debug.apk \
            AB_Khatma_V0.10_PRO_QURAN_INSTALL_SAFE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AB_Khatma_V0.10_PRO_QURAN_INSTALL_SAFE_APK
          path: AB_Khatma_V0.10_PRO_QURAN_INSTALL_SAFE.apk
          if-no-files-found: error
          retention-days: 30
