name: Build AB Khatma V0.8 Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V0.8 project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify V0.8 source
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 tools/verify_project.py

      - name: Build V0.8 Preview with Railway Server
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          gradle --no-daemon clean :app:assembleDebug \
            -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app"

      - name: Verify APK signature
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Check APK exists
        run: |
          test -f extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp \
            extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/build/outputs/apk/debug/app-debug.apk \
            AB_Khatma_V0.8_PREVIEW_AB_THEMES.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AB_Khatma_V0.8_PREVIEW_AB_THEMES_APK
          path: AB_Khatma_V0.8_PREVIEW_AB_THEMES.apk
          if-no-files-found: error
          retention-days: 30
