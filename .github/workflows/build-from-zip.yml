name: Build AB Khatma V0.9 Quran Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract stable V0.8 core
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE.zip -d extracted

      - name: Apply V0.9 Quran Husary patch
        run: |
          python3 v0_9/apply_v09_patch.py \
            extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Preserve V0.8 HomeScreen compile fix
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ab/khatma/ui/screens/HomeScreen.kt')
          s = p.read_text(encoding='utf-8')
          imp = 'import androidx.compose.runtime.CompositionLocalProvider\n'
          if imp not in s:
              anchor = 'import androidx.compose.runtime.Composable\n'
              if anchor not in s:
                  raise SystemExit('Composable import anchor not found')
              s = s.replace(anchor, imp + anchor, 1)
              p.write_text(s, encoding='utf-8')
          print('CompositionLocalProvider import ready')
          PY

      - name: Fetch verified Quran content and Husary source
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 tools/fetch_quran_content.py

      - name: Verify V0.9 source
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 tools/verify_project.py
          test -s app/src/main/assets/quran/quran-uthmani.json
          test -s app/src/main/assets/quran/quran-word-meanings.json
          test -s app/src/main/assets/quran/quran-moyassar.json
          test -s app/src/main/assets/quran/husary-audio.json

      - name: Build V0.9 Preview with Railway Server
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          gradle --no-daemon clean :app:assembleDebug \
            -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app"

      - name: Verify APK signature
        working-directory: extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Check APK exists
        run: |
          test -f extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp \
            extracted/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/build/outputs/apk/debug/app-debug.apk \
            AB_Khatma_V0.9_QURAN_HUSARY_MEANINGS_PREVIEW.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AB_Khatma_V0.9_QURAN_HUSARY_MEANINGS_APK
          path: AB_Khatma_V0.9_QURAN_HUSARY_MEANINGS_PREVIEW.apk
          if-no-files-found: error
          retention-days: 30
