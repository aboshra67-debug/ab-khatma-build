name: P42 Husary Reading Controls VC63 APK and Play AAB
on:
  push:
    branches: [release/p42-vc63-husary-controls]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android SDK 36
        run: |
          TOOL=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$TOOL"
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare restricted CI source downloader
        run: |
          npm install --prefix /tmp/browser playwright
          /tmp/browser/node_modules/.bin/playwright install chromium
      - name: Download immutable P42 safe source (SHA256 pinned)
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/a7F9-0g1jupa',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('p41_safe_source.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '421755803c460f64b0141ec794c06490a0464901584787ac61c1cbb7c1afa6af  p41_safe_source.zip' | sha256sum -c -
          mkdir -p src
          unzip -q p41_safe_source.zip -d src
      - name: Download same trusted Firebase public client settings (unchanged)
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/MxU3D1nwSkZs',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('public_config.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '8f688d435aad219c99a62ffe0d95b903befced229d9bb0dc52280e1e917a96a0  public_config.zip' | sha256sum -c -
          mkdir -p configs
          unzip -q public_config.zip -d configs
      - name: Download full 604 page offline Madani artwork (pinned source)
        run: |
          python3 <<'PY'
          import concurrent.futures, pathlib, urllib.request, time, hashlib
          root=pathlib.Path('src/AB_Khatma_P42_VC63_HUSARY_CONTROLS_SAFE_SOURCE/app/src/main/assets/quran_pages')
          root.mkdir(parents=True,exist_ok=True)
          revision='03cc496028d428eedf15d1ca9197e7eaf88b0bda'
          def get(n):
              name=f'{n:03d}.webp'
              url=f'https://raw.githubusercontent.com/akram-seid/quran-hd-images/{revision}/assets/img_remote_optimized/{name}'
              err=None
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'AB-Khatma-Offline-Mushaf/1.0'})
                      with urllib.request.urlopen(req,timeout=45) as resp:
                          data=resp.read()
                      assert len(data)>4000 and data[:4]==b'RIFF' and data[8:12]==b'WEBP',(name,len(data))
                      (root/name).write_bytes(data)
                      return len(data)
                  except Exception as ex:
                      err=ex; time.sleep(0.4*(attempt+1))
              raise RuntimeError(f'Could not get original page {name}: {err}')
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              total=sum(pool.map(get,range(1,605)))
          print(f'Offline mushaf: 604 pages, {total} bytes')
          assert len(list(root.glob('*.webp')))==604
          PY
      - name: Run strict P42 integrity and release checks
        working-directory: src/AB_Khatma_P42_VC63_HUSARY_CONTROLS_SAFE_SOURCE
        run: |
          python3 tools/check_p41_offline_mushaf.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/assets/quran_pages')
          pages=[root/f'{n:03d}.webp' for n in range(1,605)]
          assert all(p.exists() and p.stat().st_size>4000 for p in pages)
          assert 'versionCode = 63' in Path('app/build.gradle.kts').read_text()
          assert 'P42AudioPicker(' in Path('app/src/main/java/com/ab/khatma/ui/screens/QuranScreen.kt').read_text()
          assert not list(Path('.').rglob('*.p12')) and not list(Path('.').rglob('*.jks'))
          print('PASSED strict 604-page, version-code and no-private-signing checks')
          PY
      - name: Build unsigned preview APK and Play AAB
        working-directory: src/AB_Khatma_P42_VC63_HUSARY_CONTROLS_SAFE_SOURCE
        run: |
          set -a
          . ../../configs/android_client_config.txt
          set +a
          gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease \
            -PKHATMA_FIREBASE_API_KEY="$KHATMA_FIREBASE_API_KEY" \
            -PKHATMA_FIREBASE_APP_ID="$KHATMA_FIREBASE_APP_ID" \
            -PKHATMA_GOOGLE_WEB_CLIENT_ID="$KHATMA_GOOGLE_WEB_CLIENT_ID" \
            -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app" \
            -PKHATMA_V2_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app"
      - name: Collect unsigned artifacts for local original signing
        run: |
          mkdir -p unsigned_build
          APK_PATH=$(find src/AB_Khatma_P42_VC63_HUSARY_CONTROLS_SAFE_SOURCE/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          AAB_PATH=$(find src/AB_Khatma_P42_VC63_HUSARY_CONTROLS_SAFE_SOURCE/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          test -n "$APK_PATH" && test -n "$AAB_PATH"
          cp "$APK_PATH" unsigned_build/P42_VC63_UNSIGNED.apk
          cp "$AAB_PATH" unsigned_build/P42_VC63_UNSIGNED_PLAY.aab
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" unsigned_build/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" unsigned_build/zipalign
          chmod +x unsigned_build/zipalign
          sha256sum unsigned_build/P42*
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P42-VC63-UNSIGNED-LOCAL-SIGNING
          path: unsigned_build/*
          if-no-files-found: error
          retention-days: 7
      - name: Archive complete P42 safe source with offline Quran
        run: |
          cd src
          zip -q -r -9 ../AB_Khatma_P42_VC63_COMPLETE_SAFE_SOURCE.zip AB_Khatma_P42_VC63_HUSARY_CONTROLS_SAFE_SOURCE \
            -x '*/build/*' '*/.gradle/*' '*.p12' '*.jks' '*.keystore' '*.pyc' '*/__pycache__/*'
          unzip -t -q ../AB_Khatma_P42_VC63_COMPLETE_SAFE_SOURCE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P42-VC63-FULL-SAFE-SOURCE
          path: AB_Khatma_P42_VC63_COMPLETE_SAFE_SOURCE.zip
          if-no-files-found: error
          retention-days: 7
