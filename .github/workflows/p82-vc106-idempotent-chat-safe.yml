name: P82 VC106 Idempotent Chat Safe QA
on:
  push:
    branches: [release/p82-vc106-idempotent-chat-safe]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android SDK 36
        run: |
          TOOL=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$TOOL"
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare restricted CI source downloader
        run: |
          npm install --prefix /tmp/browser playwright
          /tmp/browser/node_modules/.bin/playwright install chromium
      - name: Reuse P52 VC74 signed-and-verified safe source from its public release
        run: |
          set -euo pipefail
          mkdir -p baseline src
          curl --fail -L --retry 3 -sS -o baseline/P52.zip \
            https://github.com/aboshra67-debug/ab-khatma-build/releases/download/p52-vc74-38554319458/AB_Khatma_P52_VC74_COMPLETE_SAFE_SOURCE.zip
          echo '578a56b8bd0b14836558392ce7ac8a42423f72b35aabe45d726689f8f7d68867  baseline/P52.zip' | sha256sum -c -
          unzip -q baseline/P52.zip -d src
          grep -q 'versionCode = 74' src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build.gradle.kts
      - name: Download same trusted Firebase public client settings (unchanged)
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/nBo1EY9iX-PP',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('public_config.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '91fb83b2e7c315232e7f670074762fb7e0d22e06cc19da3cbea3b82cf501c411  public_config.zip' | sha256sum -c -
          mkdir -p configs
          unzip -q public_config.zip -d configs
      - name: Apply P53 to P68 (reading mode, adhkar voice, members)
        run: |
          python3 p53/apply_p53.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p54/apply_p54.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p55/apply_p55.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p56/apply_p56.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p57/apply_p57.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p58/apply_p58.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p59/apply_p59.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p60/apply_p60.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p61/apply_p61.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p62/apply_p62.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p63/apply_p63.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p64/apply_p64.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p65/apply_p65.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p66/apply_p66.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p67/apply_p67.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p68/apply_p68.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          grep -q 'versionCode = 90' src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build.gradle.kts
      - name: Apply inspected VC91 Android UI patch (pinned SHA-256, unchanged Quran images)
        run: |
          set -euo pipefail
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/McGQ3P3KIMV5',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('vc91_android_ui_patch.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo 'bfda509b996848018f6bcb466d9b69f8b00be3501099ab30e9f21cdebec7e270  vc91_android_ui_patch.zip' | sha256sum -c -
          unzip -t -q vc91_android_ui_patch.zip
          S=src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          unzip -q -o vc91_android_ui_patch.zip -d "$S"
          test -s "$S/app/src/main/res/raw/p69_page_turn_real.ogg"
          grep -q 'Public domain' "$S/app/src/main/assets/p69_page_turn_license.txt"
          grep -q 'onUndo = ' "$S/app/src/main/java/com/ab/khatma/ui/screens/InteractiveAdhkarScreen.kt"
          grep -q 'P69PrivateChat' "$S/app/src/main/java/com/ab/khatma/secure/SecureV2Screen.kt"
          grep -q 'membersDirectory' "$S/app/src/main/java/com/ab/khatma/secure/SecureV2Api.kt"
          grep -q 'p70_colored_verse_focus.json' "$S/app/src/main/java/com/ab/khatma/ui/screens/P41OfflineMushafPage.kt"
          grep -q 'actualScale' "$S/app/src/main/java/com/ab/khatma/ui/screens/P41OfflineMushafPage.kt"
          # Overlay just the inspected VC93 controls and per-page ink geometry.
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/qfc2uvHGJRLS',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('p71_vc93_mushaf_patch.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo 'f10b49a6c122257c57c70e542bc16f71930f130aaf56086a586b50de82590765  p71_vc93_mushaf_patch.zip' | sha256sum -c -
          unzip -t -q p71_vc93_mushaf_patch.zip
          unzip -q -o p71_vc93_mushaf_patch.zip -d "$S"
          test -s "$S/app/src/main/assets/p71_mushaf_focus_geometry.json"
          grep -q 'canPan = { zoom > 1.04f }' "$S/app/src/main/java/com/ab/khatma/ui/screens/P41OfflineMushafPage.kt"
          grep -q 'P71ReadingBottom' "$S/app/src/main/java/com/ab/khatma/ui/screens/QuranScreen.kt"
          # Separate startup audio QA patch: precise published word timing, streamed (never bundled).
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/5jYxQT3Xi8tC',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('p72_vc94_opening_patch.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo 'ef842c3d88c6dbce556243bfb42212b90b299638d85bd8c96004bd19cbeeccb8  p72_vc94_opening_patch.zip' | sha256sum -c -
          unzip -t -q p72_vc94_opening_patch.zip
          unzip -q -o p72_vc94_opening_patch.zip -d "$S"
          grep -q 'P71StartupRecitation.playOnce' "$S/app/src/main/java/com/ab/khatma/MainActivity.kt"
          grep -q 'FROM_MS = 2180' "$S/app/src/main/java/com/ab/khatma/ui/screens/P71StartupRecitation.kt"
          grep -q 'Recording rights' "$S/app/src/main/assets/p71_abdulbasit_intro_audit.txt"
          # VC95: replace only three screened Compose UI files; no database or Quran artwork changes.
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/H39vZt7N86po',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('vc95_immersive_patch.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '68a60cfd27446d9b6b420378d37727e06444a8d75f603f8bba8644b13f7bbb6f  vc95_immersive_patch.zip' | sha256sum -c -
          unzip -t -q vc95_immersive_patch.zip
          unzip -q -o vc95_immersive_patch.zip -d "$S"
          grep -q 'readingMode = P68Reading.on' "$S/app/src/main/java/com/ab/khatma/ui/screens/QuranScreen.kt"
          grep -q 'if (!readingMode) P44InkOverlay' "$S/app/src/main/java/com/ab/khatma/ui/screens/P41OfflineMushafPage.kt"
          ! grep -q 'else P71ReadingBottom(' "$S/app/src/main/java/com/ab/khatma/ui/screens/QuranScreen.kt"
          grep -q 'BackHandler(enabled = displayMode == QuranMode.MADINA_PAGES && (P68Reading.on' "$S/app/src/main/java/com/ab/khatma/ui/screens/QuranScreen.kt"
          # VC96: show each original Quran line at measured full screen scale in reading mode.
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/f-ustabVYhbF',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('p74_vc96_line_layout_patch.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo 'f84b5612df55daadf015b73053bd34413776ddb1230071c7448f8a42c850321f  p74_vc96_line_layout_patch.zip' | sha256sum -c -
          unzip -t -q p74_vc96_line_layout_patch.zip
          unzip -q -o p74_vc96_line_layout_patch.zip -d "$S"
          python3 - "$S" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          geo=json.loads((root/'app/src/main/assets/p76_verse_line_layout_604.json').read_text())
          assert len(geo)==596, len(geo)
          assert '3' in geo and '5' in geo
          for n,d in geo.items():
              assert len(d['lines'])==15,(n,len(d['lines']))
              assert 0<=d['x'][0]<d['x'][1]<=1260,n
              assert all(0<=a<b<=2038 for a,b in d['lines']),n
              assert all(0<=m[1]<m[3]<=1260 and 0<=m[2]<m[4]<=2038 for m in d['notes']),n
          page=(root/'app/src/main/java/com/ab/khatma/ui/screens/P41OfflineMushafPage.kt').read_text()
          assert 'P76ReadingOnlyPage(' in page
          assert 'if (readingMode)' in page
          assert 'if (!readingMode) P44InkOverlay' in page
          print('VC96 geometry: 596 QA pages, 8 original-page fallbacks.')
          PY
          # VC97: five exact, independently verified source files; no database/schema change.
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/RcOvj5onAx7g',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('vc97_ayah_startup_groups_patch.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo 'dd13736b4b4793888319047b1578a221fb19921744795ca274e3ae1967237256  vc97_ayah_startup_groups_patch.zip' | sha256sum -c -
          unzip -t -q vc97_ayah_startup_groups_patch.zip
          unzip -q -o vc97_ayah_startup_groups_patch.zip -d "$S"
          python3 - "$S" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          p=(root/'app/src/main/java/com/ab/khatma/ui/screens/P41OfflineMushafPage.kt').read_text()
          assert 'p97ReadingHitPoint' in p
          assert 'p97ReadingHitPoint(position, size.width, size.height,' in p
          assert 'onSelectVerseAt = ::selectAt' in p
          assert 'if (!readingMode) P44InkOverlay' in p
          a=(root/'app/src/main/java/com/ab/khatma/ui/screens/P71StartupRecitation.kt').read_text()
          assert 'TO_MS = 7050' in a and 'FROM_MS = 2050' in a
          assert 'mp.currentPosition' in a
          main=(root/'app/src/main/java/com/ab/khatma/MainActivity.kt').read_text()
          assert main.index('P71StartupRecitation.playOnce(applicationContext)') < main.index('setContent {')
          s=(root/'app/src/main/java/com/ab/khatma/secure/SecureV2Screen.kt').read_text()
          assert 'groupInfo = withContext(Dispatchers.IO)' in s
          assert 'if (!groupsLoaded) groupsLoadFailed = true' in s
          print('VC97 regression invariants pass')
          PY
          # VC100: only change the active private-chat refresh to 30 s (6x fewer requests).
          python3 - "$S" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          p=root/'app/src/main/java/com/ab/khatma/secure/P69PrivateChat.kt'
          s=p.read_text(encoding='utf8')
          assert s.count('delay(5000L)') == 1, 'Refusing to patch changed private chat implementation'
          assert 'SecureV2Api.privateMessages(token, groupId, peer.id)' in s
          assert 'SecureV2Api.sendPrivate(token, groupId, peer.id, text)' in s
          s=s.replace('delay(5000L)','delay(30000L)',1)
          p.write_text(s, encoding='utf8')
          assert 'delay(30000L)' in p.read_text(encoding='utf8')
          print('VC100: private chat active-only polling 30 sec; immediate fetch after sending preserved.')
          PY
          # VC101 restores per-ayah highlight and a minimizable reading audio dock.
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/9zVCDtVDQCqy',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('vc101_ayah_reading_dock_safe_patch.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo 'a3eea2c28cdd668f4b65faaf17412a610a71db3ee3e6bda6153e640522fff9fe  vc101_ayah_reading_dock_safe_patch.zip' | sha256sum -c -
          unzip -t -q vc101_ayah_reading_dock_safe_patch.zip
          unzip -q -o vc101_ayah_reading_dock_safe_patch.zip -d "$S"
