          JS
          echo 'b1a27613e2c54d66869f769fcf08dec875ae5a70e6e4b81b2bb40a50ac84427f  vc102_restore_ayah_options.zip' | sha256sum -c -
          unzip -t -q vc102_restore_ayah_options.zip
          unzip -q -o vc102_restore_ayah_options.zip -d "$S"
          python3 - "$S" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1]);q=(root/'app/src/main/java/com/ab/khatma/ui/screens/QuranScreen.kt').read_text()
          assert 'onMore = { onPlayPrintedAyah(aya.surah, aya.ayah) }' in q
          assert 'P67AyahSheet(' in q
          assert 'private fun P101ReadingAudioDock(' in q
          assert 'Text("الخيارات"' in q
          assert 'onDismiss = { p101DockAyah = null }' in q
          print('VC102 old menu + compact reading dock preserved.')
          PY
          python3 - "$S/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          assert 'versionCode = 90' in s
          s=s.replace('versionCode = 90','versionCode = 102',1)
          s=s.replace('0.19.63-p68-reading-mode-adhkar-voice','0.19.73-p78-restore-ayah-actions-safe-qa',1)
          p.write_text(s)
          PY
          grep -q 'versionCode = 102' "$S/app/build.gradle.kts"
      - name: Apply VC104 authenticated FCM patch and preserve reading controls
        run: |
          set -euo pipefail
          S=src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 p79/apply_p79.py "$S"
          python3 p79/check_p79.py "$S"
