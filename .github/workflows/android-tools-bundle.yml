name: Android Tool Bundle
on:
  push:
    branches: [release/p24-page-next-surah-v40]
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Collect Android SDK command-line tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          "$MANAGER" "build-tools;36.0.0"
          mkdir -p public_tools
          cp "$SDK/build-tools/36.0.0/lib/apksigner.jar" public_tools/
          cp "$SDK/build-tools/36.0.0/zipalign" public_tools/
          ls -lh public_tools/
      - uses: actions/upload-artifact@v4
        with:
          name: android-public-tool-bundle
          path: public_tools/
          if-no-files-found: error
          retention-days: 2
