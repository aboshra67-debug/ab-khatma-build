name: P92 VC116 Audio Offline Redirect Safe QA
on:
  push:
    branches: [release/p92-vc116-audio-redirect-regression-safe]
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android SDK 36
        run: |
          TOOL=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$TOOL"
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare approved CI downloader
        run: |
          npm install --prefix /tmp/browser playwright
          /tmp/browser/node_modules/.bin/playwright install chromium
      - name: Download pinned complete P91 source
        uses: actions/download-artifact@v4
        with:
          name: AB-Khatma-P91-VC115-COMPLETE-SAFE-SOURCE
          run-id: 39208341181
          github-token: ${{ github.token }}
          path: baseline
      - name: Verify P91 and apply only scoped P92 safe patch
        run: |
          set -euo pipefail
          echo '6410b9eb1fab251690c0b1a3f59ea9bcbc2c4855d01bd9f3df0096758bffdd95  baseline/AB_Khatma_P91_VC115_SAFE_SOURCE.zip' | sha256sum -c -
          mkdir -p src
          unzip -q baseline/AB_Khatma_P91_VC115_SAFE_SOURCE.zip -d src
          S=src/AB_Khatma_P91_VC115_SAFE_SOURCE
          mkdir -p "$S/tools"
          cp tools/p92_apply_safe.py "$S/tools/p92_apply_safe.py"
          cp tools/p92_live_audio_test.kt "$S/tools/p92_live_audio_test.kt"
          python3 "$S/tools/p92_apply_safe.py"
          grep -q 'versionCode = 116' "$S/app/build.gradle.kts"
          grep -q '0.19.87-p92-audio-redirect-safe' "$S/app/build.gradle.kts"
          test -f "$S/app/src/androidTest/java/com/ab/khatma/guide/P92OfflineAfterDisconnectDeviceTest.kt"
          test "$(find "$S/app/src/main/assets/quran_pages_colored" -maxdepth 1 -name '*.webp' | wc -l)" -eq 604
          test "$(find "$S/app/src/main/assets/quran_verse_hitmaps" -maxdepth 1 -name '*.json' | wc -l)" -eq 604
          test "$(find "$S/app/src/main/assets/quran_pages" -maxdepth 1 -name '*.webp' | wc -l)" -eq 604
          ! find "$S" -type f \( -name '*.jks' -o -name '*.p12' -o -name '*.keystore' \) | grep .
      - name: Restore identical P91 Firebase public client parameters
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/nBo1EY9iX-PP',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('public_config.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '91fb83b2e7c315232e7f670074762fb7e0d22e06cc19da3cbea3b82cf501c411  public_config.zip' | sha256sum -c -
          mkdir -p configs
          unzip -q public_config.zip -d configs
      - name: Preserve previous on-demand plain 604-page pack outside APK
        run: |
          set -euo pipefail
          S=src/AB_Khatma_P91_VC115_SAFE_SOURCE
          mv "$S/app/src/main/assets/quran_pages" "$GITHUB_WORKSPACE/plain_hold"
      - name: Unit tests and unsigned release + Android instrumentation builds
        working-directory: src/AB_Khatma_P91_VC115_SAFE_SOURCE
        run: |
          set -euo pipefail
          set -a
          . ../../configs/android_client_config.txt
          set +a
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest \
            -PKHATMA_FIREBASE_API_KEY="$KHATMA_FIREBASE_API_KEY" \
            -PKHATMA_FIREBASE_APP_ID="$KHATMA_FIREBASE_APP_ID" \
            -PKHATMA_GOOGLE_WEB_CLIENT_ID="$KHATMA_GOOGLE_WEB_CLIENT_ID" \
            -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app" \
            -PKHATMA_V2_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app"
      - name: Package unsigned APK and safe source; do not insert signing keys
        run: |
          set -euo pipefail
          S=src/AB_Khatma_P91_VC115_SAFE_SOURCE
          mkdir -p unsigned_build ci_tests safe_source
          cp "$S/app/build/outputs/apk/release/app-release-unsigned.apk" unsigned_build/P92_VC116_UNSIGNED_REVIEW.apk
          test "$(unzip -l unsigned_build/P92_VC116_UNSIGNED_REVIEW.apk | grep -c 'assets/quran_pages_colored/.*\.webp')" -eq 604
          test "$(unzip -l unsigned_build/P92_VC116_UNSIGNED_REVIEW.apk | grep -c 'assets/quran_verse_hitmaps/.*\.json')" -eq 604
          test "$(stat -c%s unsigned_build/P92_VC116_UNSIGNED_REVIEW.apk)" -lt 190000000
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" unsigned_build/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" unsigned_build/
          keytool -genkeypair -keystore /tmp/p92-ci-test.jks -alias ci -storepass android -keypass android -dname "CN=Ephemeral CI Test Key" -keyalg RSA -validity 2
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks /tmp/p92-ci-test.jks --ks-key-alias ci --ks-pass pass:android --key-pass pass:android --v4-signing-enabled false --out ci_tests/p92-ci-app.apk "$(find "$S/app/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)"
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks /tmp/p92-ci-test.jks --ks-key-alias ci --ks-pass pass:android --key-pass pass:android --v4-signing-enabled false --out ci_tests/p92-ci-test.apk "$(find "$S/app/build/outputs/apk/androidTest/debug" -maxdepth 1 -name '*.apk' -print -quit)"
          rm -f /tmp/p92-ci-test.jks
          mv "$GITHUB_WORKSPACE/plain_hold" "$S/app/src/main/assets/quran_pages"
          python3 - <<'PY'
          import pathlib,zipfile
          source=pathlib.Path('src/AB_Khatma_P91_VC115_SAFE_SOURCE')
          dest=pathlib.Path('safe_source/AB_Khatma_P92_VC116_SAFE_SOURCE.zip')
          with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED,compresslevel=5) as z:
              for p in sorted(source.rglob('*')):
                  if not p.is_file(): continue
                  relative=p.relative_to(source)
                  if any(t in ('build','.gradle','.git') for t in relative.parts) or p.name=='local.properties':continue
                  assert p.suffix.lower() not in ('.p12','.jks','.keystore','.apk','.aab','.pem'),relative
                  z.write(p,'AB_Khatma_P92_VC116_SAFE_SOURCE/'+relative.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P92-VC116-UNSIGNED-APK-REVIEW
          path: unsigned_build/*
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P92-VC116-COMPLETE-SAFE-SOURCE
          path: safe_source/*
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AB-Khatma-P92-VC116-UNIT-TEST-REPORT
          path: src/AB_Khatma_P91_VC115_SAFE_SOURCE/app/build/test-results/testDebugUnitTest/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P92-VC116-CI-TEST-APKS
          path: ci_tests/*
          retention-days: 7
          if-no-files-found: error

  android-ui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: AB-Khatma-P92-VC116-CI-TEST-APKS
          path: ci_tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            adb wait-for-device
            adb install -r ci_tests/p92-ci-app.apk
            adb install -r ci_tests/p92-ci-test.apk
            adb shell pm grant com.ab.khatma.preview android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -r -e class com.ab.khatma.guide.P91OfflineDeviceTest,com.ab.khatma.guide.P92LiveAudioDeviceTest,com.ab.khatma.guide.P89DirectMediaDeviceTest,com.ab.khatma.guide.P88IbtehalDeviceTest,com.ab.khatma.guide.P85GuideUiTest,com.ab.khatma.guide.P85ReaderDeviceTest com.ab.khatma.preview.test/androidx.test.runner.AndroidJUnitRunner > p92-online-result.txt
            cat p92-online-result.txt
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' p92-online-result.txt
            grep -E '^OK \([0-9]+ tests?\)' p92-online-result.txt
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell cmd connectivity airplane-mode enable
            sleep 4
            adb shell am instrument -w -r -e class com.ab.khatma.guide.P92OfflineAfterDisconnectDeviceTest com.ab.khatma.preview.test/androidx.test.runner.AndroidJUnitRunner > p92-offline-result.txt
            cat p92-offline-result.txt
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' p92-offline-result.txt
            grep -E '^OK \([0-9]+ tests?\)' p92-offline-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AB-Khatma-P92-VC116-NATIVE-DEVICE-RESULTS
          path: |
            p92-online-result.txt
            p92-offline-result.txt
          retention-days: 30
