name: V0.17 Android Emulator Startup Smoke
on:
  pull_request:
    paths:
      - '.github/workflows/v017-emulator-smoke.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download signed P4 APK from verified build
        uses: actions/download-artifact@v4
        with:
          run-id: 37846363844
          github-token: ${{ github.token }}
          name: AB_Khatma_V0.17_P4_PAGES_CHAT_STAGING_TEST_APK
          path: apk
      - name: Verify APK was downloaded
        run: |
          test -s apk/AB_Khatma_V0.17_P4_PAGES_CHAT_STAGING_TEST.apk
          sha256sum apk/AB_Khatma_V0.17_P4_PAGES_CHAT_STAGING_TEST.apk
      - name: Boot Android 35 and run first-launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r apk/AB_Khatma_V0.17_P4_PAGES_CHAT_STAGING_TEST.apk
            adb shell am start -n com.ab.khatma.v17p4staging/com.ab.khatma.MainActivity
            sleep 12
            adb shell pidof com.ab.khatma.v17p4staging
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml window.xml
            grep -q "أهلًا بك في ختمة" window.xml
            ! grep -q "Upgrade to the authenticated V2 API" window.xml
            adb shell screencap -p /sdcard/khatma-start.png
            adb pull /sdcard/khatma-start.png khatma-start.png
            adb logcat -d -v brief > khatma-logcat.txt
            if grep -q "FATAL EXCEPTION.*" khatma-logcat.txt; then
              echo "FATAL EXCEPTION found in emulator logcat"
              exit 1
            fi
      - name: Upload first-launch visual and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AB_Khatma_V0.17_EmulatorSmoke
          path: |
            khatma-start.png
            window.xml
            khatma-logcat.txt
          if-no-files-found: warn
          retention-days: 7
