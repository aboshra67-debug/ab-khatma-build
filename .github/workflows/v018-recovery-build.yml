name: V0.19 P13 Permanent Preview Signing + P12 UI
on:
  push:
    branches:
      - 'feature/khatma-firebase-google-20261009'
    paths:
      - 'v0_18/**'
      - 'v0_19/**'
      - '.github/workflows/v018-recovery-build.yml'
  pull_request:
    paths:
      - 'v0_18/**'
      - '.github/workflows/v018-recovery-build.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verified-redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified P4 source from successful build
        uses: actions/download-artifact@v4
        with:
          run-id: 37846363844
          github-token: ${{ github.token }}
          name: AB_Khatma_V0.17_P4_SAFE_SOURCE
          path: baseline
      - name: Extract verified original without network Quran fetch
        run: |
          set -euo pipefail
          unzip -t baseline/AB_Khatma_V0.17_P4_SAFE_SOURCE.zip
          mkdir -p working
          unzip -q baseline/AB_Khatma_V0.17_P4_SAFE_SOURCE.zip -d working
          test -s working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/src/main/assets/quran/quran-uthmani.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Configure Android SDK and build tools 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Safe V0.18 UI patch
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/v0_18/p5_polished_ui.py"
          python3 tools/verify_project.py
          test -s app/src/main/java/com/ab/khatma/secure/KhatmaPolishedPanels.kt
          grep -q 'versionCode = 21' app/build.gradle.kts
      - name: Apply V0.18 P6 coherent Noor default
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/v0_18/p6_noor_default.py"
          python3 tools/verify_project.py
          grep -q 'versionCode = 22' app/build.gradle.kts
          grep -q 'prefs.getString("theme_style", KhatmaThemeStyle.NOOR.name)' app/src/main/java/com/ab/khatma/ui/theme/KhatmaTheme.kt

      - name: Apply V0.18 P7 compact onboarding and clear status
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/v0_18/p7_compact_auth_ui.py"
          python3 tools/verify_project.py
          grep -q 'versionCode = 23' app/build.gradle.kts
          grep -q 'if (session != null) TopAppBar' app/src/main/java/com/ab/khatma/secure/SecureV2Screen.kt

      - name: Add real Firebase Google sign-in (no fake OAuth)
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/v0_19/p8_google_integration.py"
          python3 tools/verify_project.py
          grep -q 'versionCode = 24' app/build.gradle.kts
          grep -q 'GoogleIdTokenCredential' app/src/main/java/com/ab/khatma/secure/KhatmaGoogleSignIn.kt
          grep -q 'googleLogin' app/src/main/java/com/ab/khatma/secure/SecureV2Api.kt

      - name: Apply V0.19 P9 safe login UI and OAuth guards
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/v0_19/p9_auth_ui.py"
          python3 tools/verify_project.py
          grep -q 'versionCode = 25' app/build.gradle.kts
          grep -q 'enabled = !busy && googleReady' app/src/main/java/com/ab/khatma/secure/KhatmaPolishedPanels.kt

      - name: Apply V0.19 P10 supplied Google OAuth (Safe Patch)
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/v0_19/p10_enable_google_oauth.py"
          python3 tools/verify_project.py
          grep -q 'versionCode = 26' app/build.gradle.kts

      - name: Apply P11 UI and profile patch
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/v0_19/p11a_profile_refresh.py"
          python3 "$GITHUB_WORKSPACE/v0_19/p11b_leader_design.py"
          python3 tools/verify_project.py

      - name: Apply P12 calm shared hub and login
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/v0_19/p12_calm_login_home.py"
          python3 tools/verify_project.py
          grep -q 'versionCode = 28' app/build.gradle.kts
          grep -q 'KhatmaCalmHome' app/src/main/java/com/ab/khatma/secure/SecureV2Screen.kt
          grep -q 'GoogleAuthProvider' app/src/main/java/com/ab/khatma/secure/KhatmaGoogleSignIn.kt

      - name: P13 require unsigned preview and permanent signer
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/v0_19/p13_require_stable_signing.py"
          python3 tools/verify_project.py
          grep -q 'versionCode = 29' app/build.gradle.kts
          grep -q 'signingConfig = null' app/build.gradle.kts

      - name: Configure public Firebase client identifiers from supplied JSON
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          c=json.loads(Path('v0_19/firebase_public_client.json').read_text())
          assert c["firebase_project_id"] == "ab-khatma"
          assert c["registered_android_package"] == "com.ab.khatma.preview"
          assert c["firebase_android_app_id"] == "1:812962740222:android:4cce0addaa5210d24a32af"
          assert c["firebase_api_key"].startswith("AIza")
          assert c["google_web_client_id"].endswith(".apps.googleusercontent.com")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
              env.write("KHATMA_FIREBASE_PROJECT_ID="+c["firebase_project_id"]+"\n")
              env.write("KHATMA_FIREBASE_APP_ID="+c["firebase_android_app_id"]+"\n")
              env.write("KHATMA_FIREBASE_API_KEY="+c["firebase_api_key"]+"\n")
              env.write("KHATMA_GOOGLE_WEB_CLIENT_ID="+c["google_web_client_id"]+"\n")
          print("Firebase project: ab-khatma; Web OAuth client configured:",bool(c["google_web_client_id"]))
          PY

      - name: Archive Safe Source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path("working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE")
          out=Path("AB_Khatma_V019_P13_STABLE_SIGNING_SAFE_SOURCE.zip")
          files=[p for p in root.rglob("*") if p.is_file()
             and not (set(p.relative_to(root).parts) & {".gradle", "build", "__pycache__", ".git"})
             and not p.name.startswith(".env")
             and p.suffix.lower() not in {".keystore",".jks",".p12",".pem",".key"}]
          with ZipFile(out,"w",compression=ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to(root.parent).as_posix())
          with ZipFile(out) as z:assert z.testzip() is None
          print("V018 Safe Source",len(files),"files",out.stat().st_size,"bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AB_Khatma_V019_P13_STABLE_SIGNING_SAFE_SOURCE
          path: AB_Khatma_V019_P13_STABLE_SIGNING_SAFE_SOURCE.zip
          if-no-files-found: error
      - name: Keep preview separate without changing registered production package
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          grep -q 'applicationId = "com.ab.khatma"' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".preview"' app/build.gradle.kts
          # Actual debug package is com.ab.khatma.preview; it must be registered
          # separately in Firebase with the SHA-1/SHA-256 from this APK.
      - name: Build unsigned preview APK
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          gradle --no-daemon clean :app:assembleDebug \
            -PKHATMA_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app" \
            -PKHATMA_V2_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app" \
            -PKHATMA_FIREBASE_PROJECT_ID="$KHATMA_FIREBASE_PROJECT_ID" \
            -PKHATMA_FIREBASE_APP_ID="$KHATMA_FIREBASE_APP_ID" \
            -PKHATMA_FIREBASE_API_KEY="$KHATMA_FIREBASE_API_KEY" \
            -PKHATMA_GOOGLE_WEB_CLIENT_ID="$KHATMA_GOOGLE_WEB_CLIENT_ID"
      - name: Package unsigned preview and official offline signing tools
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          out=AB_Khatma_P13_UNSIGNED_OFFLINE_TOOLS
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          apkdir=working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/build/outputs/apk/debug
          mkdir -p "$out/tools/lib"
          test "$(find "$apkdir" -maxdepth 1 -name '*-unsigned.apk' | wc -l)" -eq 1
          cp "$apkdir/"*-unsigned.apk "$out/unsigned.apk"
          cp "$sdk/apksigner" "$out/tools/"
          cp "$sdk/zipalign" "$out/tools/"
          cp "$sdk/lib/apksigner.jar" "$out/tools/lib/"
          sha256sum "$out/unsigned.apk" "$out/tools/lib/apksigner.jar" > "$out/SHA256SUMS.txt"
          tar -czf "${out}.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: AB_Khatma_P13_UNSIGNED_OFFLINE_TOOLS
          path: AB_Khatma_P13_UNSIGNED_OFFLINE_TOOLS.tar.gz
          if-no-files-found: error

      - name: Check permanent preview signing secrets
        if: github.event_name != 'pull_request'
        env:
          KHATMA_PREVIEW_KEYSTORE_B64: ${{ secrets.KHATMA_PREVIEW_KEYSTORE_B64 }}
          KHATMA_PREVIEW_STORE_PASSWORD: ${{ secrets.KHATMA_PREVIEW_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          python3 v0_19/stable_preview_signing.py prepare

      - name: Permanently sign and verify preview APK
        if: github.event_name != 'pull_request'
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        env:
          KHATMA_PREVIEW_STORE_PASSWORD: ${{ secrets.KHATMA_PREVIEW_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/v0_19/stable_preview_signing.py" sign
      - name: Export Android APK
        if: github.event_name != 'pull_request'
        run: |
          cp working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/build/outputs/apk/debug/app-preview-stable.apk AB_Khatma_V019_P13_STABLE_SIGNED_PREVIEW.apk
          test -s AB_Khatma_V019_P13_STABLE_SIGNED_PREVIEW.apk
          sha256sum AB_Khatma_V019_P13_STABLE_SIGNED_PREVIEW.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: AB_Khatma_V019_P13_STABLE_SIGNED_PREVIEW_APK
          path: AB_Khatma_V019_P13_STABLE_SIGNED_PREVIEW.apk
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/ab-khatma-preview-private"
