name: V0.18 Polished UI from Verified P4 Source
on:
  pull_request:
    paths:
      - 'v0_18/**'
      - '.github/workflows/v018-recovery-build.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verified-redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified P4 source from successful build
        uses: actions/download-artifact@v4
        with:
          run-id: 37846363844
          github-token: ${{ github.token }}
          name: AB_Khatma_V0.17_P4_SAFE_SOURCE
          path: baseline
      - name: Extract verified original without network Quran fetch
        run: |
          set -euo pipefail
          unzip -t baseline/AB_Khatma_V0.17_P4_SAFE_SOURCE.zip
          mkdir -p working
          unzip -q baseline/AB_Khatma_V0.17_P4_SAFE_SOURCE.zip -d working
          test -s working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/src/main/assets/quran/quran-uthmani.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android 36 build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Safe V0.18 UI patch
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/v0_18/p5_polished_ui.py"
          python3 tools/verify_project.py
          test -s app/src/main/java/com/ab/khatma/secure/KhatmaPolishedPanels.kt
          grep -q 'versionCode = 21' app/build.gradle.kts
      - name: Archive Safe Source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path("working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE")
          out=Path("AB_Khatma_V018_P5_SAFE_SOURCE.zip")
          files=[p for p in root.rglob("*") if p.is_file()
             and not (set(p.relative_to(root).parts) & {".gradle", "build", "__pycache__", ".git"})
             and not p.name.startswith(".env")
             and p.suffix.lower() not in {".keystore",".jks",".p12",".pem",".key"}]
          with ZipFile(out,"w",compression=ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to(root.parent).as_posix())
          with ZipFile(out) as z:assert z.testzip() is None
          print("V018 Safe Source",len(files),"files",out.stat().st_size,"bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AB_Khatma_V018_P5_SAFE_SOURCE
          path: AB_Khatma_V018_P5_SAFE_SOURCE.zip
          if-no-files-found: error
      - name: Independent test app ID with absolute Android component names
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          assert s.count('applicationId = "com.ab.khatma"') == 1
          p.write_text(s.replace('applicationId = "com.ab.khatma"',
                        'applicationId = "com.ab.khatma.v18p5design"'),encoding='utf-8')
          manifest=Path('app/src/main/AndroidManifest.xml')
          x=manifest.read_text(encoding='utf-8')
          assert x.count('android:name=".MainActivity"')==1
          assert x.count('android:name=".KhatmaApplication"')==1
          x=x.replace('android:name=".MainActivity"','android:name="com.ab.khatma.MainActivity"')
          x=x.replace('android:name=".KhatmaApplication"','android:name="com.ab.khatma.KhatmaApplication"')
          manifest.write_text(x,encoding='utf-8')
          PY
      - name: Build signed debug test APK
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          gradle --no-daemon clean :app:assembleDebug \
            -PKHATMA_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app" \
            -PKHATMA_V2_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app"
      - name: Verify debug signature
        working-directory: working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Export Android APK
        run: |
          cp working/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/build/outputs/apk/debug/app-debug.apk AB_Khatma_V018_P5_DESIGN_AUTH_TEST.apk
          test -s AB_Khatma_V018_P5_DESIGN_AUTH_TEST.apk
          sha256sum AB_Khatma_V018_P5_DESIGN_AUTH_TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AB_Khatma_V018_P5_DESIGN_AUTH_TEST_APK
          path: AB_Khatma_V018_P5_DESIGN_AUTH_TEST.apk
          if-no-files-found: error
