name: P22 Surah Isolation Build
on:
  push:
    branches: [release/p22-surah-only-v38]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Configure Android
        run: |
          TOOL=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
      - name: Install Android Platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Fetch source for building
        run: |
          npm install --prefix /tmp/browser playwright
          /tmp/browser/node_modules/.bin/playwright install chromium
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          async function download(url,out) {
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({acceptDownloads:true});
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.getByRole('button',{name:'ダウンロード',exact:true}).waitFor({state:'visible',timeout:60000});
            const [d]=await Promise.all([page.waitForEvent('download',{timeout:60000}),page.getByRole('button',{name:'ダウンロード',exact:true}).click()]);
            await d.saveAs(out);await browser.close();
          }
          (async()=>{
            await download('https://firestorage.ai/ja/f/QZnQA5XI1Qiv','source.zip');
            await download('https://firestorage.ai/ja/f/LbThokuWeZ0M','client_config.zip');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '35809e2c3e323e12bb1ef874febf5b62f87f875b9b0852e255aa51fdf224765a  source.zip' | sha256sum -c -
          mkdir -p src configs
          unzip -q source.zip -d src
          unzip -q client_config.zip -d configs
      - name: Apply isolated-surah patch and validate changes
        working-directory: src/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 "$GITHUB_WORKSPACE/release_patches/p22_surah_isolation.py"
          python3 tools/verify_project.py
          grep -q 'versionCode = 38' app/build.gradle.kts
          grep -q 'target.surah?.let(repo::loadSurah)' app/src/main/java/com/ab/khatma/ui/screens/QuranScreen.kt
          git diff --no-index /dev/null app/build.gradle.kts >/dev/null || true
      - name: Build
        working-directory: src/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE
        run: |
          python3 tools/verify_project.py
          set -a
          . ../../configs/android_client_config.txt
          set +a
          gradle --no-daemon :app:assembleDebug -PKHATMA_FIREBASE_API_KEY="$KHATMA_FIREBASE_API_KEY" -PKHATMA_FIREBASE_APP_ID="$KHATMA_FIREBASE_APP_ID" -PKHATMA_GOOGLE_WEB_CLIENT_ID="$KHATMA_GOOGLE_WEB_CLIENT_ID" -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app" -PKHATMA_V2_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app"
      - uses: actions/upload-artifact@v4
        with:
          name: P22-isolated-surah-unsigned-apk
          path: src/Khatma_Daily_V0_8_WORKING_CORE_AB_THEMES_SAFE/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
