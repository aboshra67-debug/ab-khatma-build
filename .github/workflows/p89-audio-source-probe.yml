name: P89 Public Audio Source Verification
on:
  push:
    branches: [release/p89-vc113-direct-audio-safe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix /tmp/inspect playwright
          /tmp/inspect/node_modules/.bin/playwright install --with-deps chromium
      - name: Test real media endpoints without storing copyrighted audio
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/inspect/node_modules/playwright');
          (async()=>{
          const sources=[
          'https://misrquran.gov.eg/audio-details/525068d3-d74e-45a9-88ae-e69165a15abf',
          'https://misrquran.gov.eg/audio-details/04ddfe19-a6ea-4611-9b29-5227bc6c8077',
          'https://audio.islamweb.net/audio/index.php?audioid=122665&page=audioinfo',
          'https://cdn.mp3quran.net/audio/muhammad-refaat/r1/001.mp3',
          'https://cdn.mp3quran.net/audio/muhammad-refaat/r1/055.mp3'];
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            for(const source of sources){
              console.log('SOURCE',source);
              try{
                if(source.endsWith('.mp3')){
                  let res=await page.request.get(source,{headers:{Range:'bytes=0-511'},timeout:20000});
                  console.log('AUDIO_PROBE',res.status(),res.headers()['content-type'],res.headers()['content-length'],res.headers()['content-range']||'',res.url());
                  continue;
                }
                let urls=new Set();let responses=[];
                const handler=async r=>{
                  const u=r.url();const ct=r.headers()['content-type']||'';
                  if(/audio\/(mpeg|mp3|ogg|wav)|\.mp3([?#]|$)|\.m4a([?#]|$)|\.mp4([?#]|$)/i.test(ct+' '+u)){urls.add(u);responses.push([r.status(),ct,u]);}
                };
                page.on('response',handler);
                await page.goto(source,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2500);
                console.log('PAGE',page.url(),(await page.title()).slice(0,90));
                const buttons=await page.locator('button,a,audio,source').evaluateAll(xs=>xs.map(x=>({tag:x.tagName,text:(x.innerText||'').slice(0,40),src:x.src||x.href})).filter(x=>/play|listen|استمع|تشغيل|تحميل|download|mp3|audio/i.test(x.text+' '+x.src)).slice(0,20));
                console.log('CONTROLS',JSON.stringify(buttons).slice(0,1800));
                console.log('MEDIA',JSON.stringify(responses).slice(0,2500));
                page.off('response',handler);
              }catch(e){console.log('PROBE_FAIL',String(e).slice(0,350))}
            }
          }finally{await browser.close()}
          })().catch(e=>{console.error(String(e));process.exit(1)});
          JS
