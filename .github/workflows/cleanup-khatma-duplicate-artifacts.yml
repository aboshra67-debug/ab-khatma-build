name: Cleanup Khatma duplicate artifacts

on:
  push:
    branches:
      - cleanup-khatma-artifacts-20260907

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete duplicate V0.13 artifacts and keep latest copy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for id in 9718349175 9718346284 9718342920 9718340565; do
            echo "Deleting duplicate artifact $id"
            curl --fail-with-body -sS -L \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$id"
          done
          echo "Kept latest artifact 9718351541"
