          cd src
          zip -q -r -9 ../AB_Khatma_P43_VC64_COMPLETE_SAFE_SOURCE.zip AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE \
            -x '*/build/*' '*/.gradle/*' '*.p12' '*.jks' '*.keystore' '*.pyc' '*/__pycache__/*'
          unzip -t -q ../AB_Khatma_P43_VC64_COMPLETE_SAFE_SOURCE.zip
