name: P19 Source Download Check
on:
  push:
    branches: [p19-mushaf-build-20261010]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect dynamic share in headless browser
        run: |
          npm install --prefix /tmp/p19-browser playwright
          /tmp/p19-browser/node_modules/.bin/playwright install chromium
          node <<'JS'
          const { chromium } = require('/tmp/p19-browser/node_modules/playwright');
          (async () => {
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({acceptDownloads:true});
            page.on('download', async d => {
              const path=await d.path();
              console.log('DOWNLOAD SUCCESS:',d.suggestedFilename(),path);
            });
            await page.goto('https://firestorage.ai/ja/f/btI8J2ohfegz',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(14000);
            console.log('FINAL URL:',page.url().split('?')[0]);
            console.log('BODY:',(await page.locator('body').innerText()).slice(0,3600));
            console.log('BUTTONS:',await page.locator('button').allTextContents());
            console.log('LINKS:',(await page.locator('a').allTextContents()).slice(0,35));
            await browser.close();
          })().catch(e=>{console.error(String(e));process.exit(1)})
          JS
