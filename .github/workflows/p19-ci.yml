name: P19 Share Page Analysis
on:
  push:
    branches: [p19-mushaf-build-20261010]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect source download flow
        run: |
          python3 - <<'PY'
          import re,html,urllib.request
          url='https://firestorage.ai/ja/f/btI8J2ohfegz'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r: body=r.read().decode('utf-8',errors='ignore')
          body=re.sub(r'<script[^>]*>.*?</script>','',body,flags=re.I|re.S)
          print('HTML text:',html.unescape(re.sub(r'<[^>]*>',' ',body))[:7000])
          print('Elements:')
          for line in re.findall(r'<(?:a|button|form|iframe|input|meta|link)\\b[^>]{0,1200}>',body,re.I):
              print(line[:500])
          PY
