name: P39 Reader Daily Assignment Confirm - Android VC60
on:
  push:
    branches: [release/p39-reader-daily-confirm-vc60]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android SDK 36
        run: |
          TOOL=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$TOOL"
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare downloader
        run: |
          npm install --prefix /tmp/browser playwright
          /tmp/browser/node_modules/.bin/playwright install chromium
      - name: Download P39 VC60 Safe Source (SHA-256 pinned)
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/NWi61DxNxgAb',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('p36_safe_source.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '8181a46295d0f384ca321c56b936074f784f36f42e570f009b16bdf8e2451da9  p36_safe_source.zip' | sha256sum -c -
          mkdir -p src
          unzip -q p36_safe_source.zip -d src
      - name: Download existing Android Firebase public client configuration
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/MxU3D1nwSkZs',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('public_config.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '8f688d435aad219c99a62ffe0d95b903befced229d9bb0dc52280e1e917a96a0  public_config.zip' | sha256sum -c -
          mkdir -p configs
          unzip -q public_config.zip -d configs
      - name: Verify safe patch and compile unsigned APK
        working-directory: src/AB_Khatma_P39_VC60_READER_DAILY_CONFIRM_SAFE_SOURCE
        run: |
          python3 tools/check_p39_reader_home.py
          grep -q 'versionCode = 60' app/build.gradle.kts
          grep -q 'applicationId = "com.ab.khatma"' app/build.gradle.kts
          set -a
          . ../../configs/android_client_config.txt
          set +a
          gradle --no-daemon --stacktrace :app:assembleDebug \
            -PKHATMA_FIREBASE_API_KEY="$KHATMA_FIREBASE_API_KEY" \
            -PKHATMA_FIREBASE_APP_ID="$KHATMA_FIREBASE_APP_ID" \
            -PKHATMA_GOOGLE_WEB_CLIENT_ID="$KHATMA_GOOGLE_WEB_CLIENT_ID" \
            -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app" \
            -PKHATMA_V2_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app"
      - name: Collect unsigned APK and signing tools
        run: |
          mkdir -p unsigned_build
          find src/AB_Khatma_P39_VC60_READER_DAILY_CONFIRM_SAFE_SOURCE/app/build/outputs/apk/debug -type f -name '*.apk' -print -exec cp {} unsigned_build/app-debug-unsigned.apk \;
          test -s unsigned_build/app-debug-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" unsigned_build/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" unsigned_build/zipalign
          chmod +x unsigned_build/zipalign
          sha256sum unsigned_build/*
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P39-VC60-UNSIGNED-LOCAL-SIGNING
          path: unsigned_build/*
          if-no-files-found: error
          retention-days: 7
