name: P52 VC74 Compact Wards and Surah Listening
on:
  push:
    branches: [release/p52-vc74-compact-wards-surah-listen]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android SDK 36
        run: |
          TOOL=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$TOOL"
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare restricted CI source downloader
        run: |
          npm install --prefix /tmp/browser playwright
          /tmp/browser/node_modules/.bin/playwright install chromium
      - name: Reuse P51 VC73 signed-and-verified safe source (all previous patches already applied)
        uses: actions/download-artifact@v4
        with:
          name: AB-Khatma-P51-VC73-FULL-SAFE-SOURCE
          run-id: 38369142729
          github-token: ${{ github.token }}
          repository: aboshra67-debug/ab-khatma-build
          path: baseline
      - name: Extract P51 source (no changes to audio or Quran)
        run: |
          test -s baseline/AB_Khatma_P51_VC73_COMPLETE_SAFE_SOURCE.zip
          echo '3ec0222aa5c986ea53e46828e268777ce1192d8a2b71c38f072a98711a47c6e9  baseline/AB_Khatma_P51_VC73_COMPLETE_SAFE_SOURCE.zip' | sha256sum -c -
          mkdir -p src
          unzip -q baseline/AB_Khatma_P51_VC73_COMPLETE_SAFE_SOURCE.zip -d src
          test -d src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          grep -q 'versionCode = 73' src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build.gradle.kts
      - name: Download same trusted Firebase public client settings (unchanged)
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/nBo1EY9iX-PP',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('public_config.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '91fb83b2e7c315232e7f670074762fb7e0d22e06cc19da3cbea3b82cf501c411  public_config.zip' | sha256sum -c -
          mkdir -p configs
          unzip -q public_config.zip -d configs
      - name: Apply P52 compact home cards and surah listening
        run: |
          python3 p52/apply_p52.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          grep -q 'versionCode = 74' src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build.gradle.kts
      - name: Build unsigned preview APK and Play AAB
        working-directory: src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
        run: |
          set -a
          . ../../configs/android_client_config.txt
          set +a
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:bundleRelease \
            -PKHATMA_FIREBASE_API_KEY="$KHATMA_FIREBASE_API_KEY" \
            -PKHATMA_FIREBASE_APP_ID="$KHATMA_FIREBASE_APP_ID" \
            -PKHATMA_GOOGLE_WEB_CLIENT_ID="$KHATMA_GOOGLE_WEB_CLIENT_ID" \
            -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app" \
            -PKHATMA_V2_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app"
      - name: Collect unsigned artifacts for local original signing
        run: |
          mkdir -p unsigned_build
          APK_PATH=$(find src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          AAB_PATH=$(find src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          test -n "$APK_PATH" && test -n "$AAB_PATH"
          cp "$APK_PATH" unsigned_build/P52_VC74_UNSIGNED_RELEASE.apk
          cp "$AAB_PATH" unsigned_build/P52_VC74_UNSIGNED_PLAY.aab
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" unsigned_build/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" unsigned_build/zipalign
          chmod +x unsigned_build/zipalign
          sha256sum unsigned_build/P52*
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P52-VC74-UNSIGNED-LOCAL-SIGNING
          path: unsigned_build/*
          if-no-files-found: error
          retention-days: 30
      - name: Archive complete P52 safe source with original Quran and adhan
        run: |
          cd src
          zip -q -r -9 ../AB_Khatma_P52_VC74_COMPLETE_SAFE_SOURCE.zip AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE \
            -x '*/build/*' '*/.gradle/*' '*.p12' '*.jks' '*.keystore' '*.pyc' '*/__pycache__/*'
          unzip -t -q ../AB_Khatma_P52_VC74_COMPLETE_SAFE_SOURCE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P52-VC74-FULL-SAFE-SOURCE
          path: AB_Khatma_P52_VC74_COMPLETE_SAFE_SOURCE.zip
          if-no-files-found: error
          retention-days: 30
