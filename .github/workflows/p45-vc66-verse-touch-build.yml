name: P45 VC66 Direct Touch Ayah Audio APK and Play AAB
on:
  push:
    branches: [release/p45-vc66-verse-touch]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android SDK 36
        run: |
          TOOL=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$TOOL"
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare restricted CI source downloader
        run: |
          npm install --prefix /tmp/browser playwright
          /tmp/browser/node_modules/.bin/playwright install chromium
      - name: Download proven P43 baseline including original and colored Quran pages
        uses: actions/download-artifact@v4
        with:
          name: AB-Khatma-P43-VC64-FULL-SAFE-SOURCE
          run-id: 38178487399
          github-token: ${{ github.token }}
          repository: aboshra67-debug/ab-khatma-build
          path: baseline
      - name: Extract exact P43 complete Safe Source
        run: |
          test -s baseline/AB_Khatma_P44_VC65_COMPLETE_SAFE_SOURCE.zip
          unzip -q baseline/AB_Khatma_P44_VC65_COMPLETE_SAFE_SOURCE.zip -d src
          test -d src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
      - name: Fetch pinned P44 add-only patch without private signing information
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/lN7DdsLUPe-9',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('p45-patch.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo 'e913693a42bd729ef0fe9bcfbc2cc0eabc83615c561f18cd8b956649cde4def2  p45-patch.zip' | sha256sum -c -
          unzip -q p45-patch.zip -d patchkit
      - name: Download same trusted Firebase public client settings (unchanged)
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/nBo1EY9iX-PP',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('public_config.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '91fb83b2e7c315232e7f670074762fb7e0d22e06cc19da3cbea3b82cf501c411  public_config.zip' | sha256sum -c -
          mkdir -p configs
          unzip -q public_config.zip -d configs
      - name: Apply P45 replacement to precise reader files only
        run: |
          cd src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          cp -v "$GITHUB_WORKSPACE/patchkit/app/build.gradle.kts" app/
          cp -v "$GITHUB_WORKSPACE/patchkit/app/src/main/java/com/ab/khatma/ui/screens/"*.kt app/src/main/java/com/ab/khatma/ui/screens/
          cp -v "$GITHUB_WORKSPACE/patchkit/tools/build_p45_verse_hitmaps.py" tools/
          test "$(find app/src/main/assets/quran_pages -type f -name '*.webp' | wc -l)" -eq 604
          test "$(find app/src/main/assets/quran_pages_colored -type f -name '*.webp' | wc -l)" -eq 604
          grep -q 'versionCode = 66' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".preview"' app/build.gradle.kts
          grep -q 'P45VerseHitMap' app/src/main/java/com/ab/khatma/ui/screens/P41OfflineMushafPage.kt
          test ! -e app/src/main/assets/quran_pages/000.webp
          ! find . -type f \( -name '*.p12' -o -name '*.jks' -o -name '*.keystore' \) | grep .
      - name: Install pinned local SVG hit-map renderer
        run: python3 -m pip install --break-system-packages numpy==2.3.5 scipy==1.16.3 lxml==6.0.2 pillow==12.1.1 cairosvg==2.8.2
      - name: Retrieve 604 immutable vector sources with canonical verse IDs
        run: |
          python3 <<'PY'
          import concurrent.futures,pathlib,urllib.request,time
          revision='ae5786ab08597f8123575dec4e774f1eca195e0f'
          folder=pathlib.Path('source_svg');folder.mkdir(exist_ok=True)
          def get(n):
              name=f'{n:03d}.svg'
              url=f'https://raw.githubusercontent.com/mushafdatabase/MushafDatabase-Ligature-Based-SVG/{revision}/SVG%20V1.01/{name}'
              error=None
              for attempt in range(5):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'ABKhatmaP45/1.0'})
                      with urllib.request.urlopen(req,timeout=60) as resp: data=resp.read()
                      assert len(data)>75000 and b'data-md-version="1.01"' in data
                      (folder/name).write_bytes(data)
                      return len(data)
                  except Exception as e:
                      error=e;time.sleep(0.5*(attempt+1))
              raise RuntimeError(f'Verse map data unavailable for page {name}: {error}')
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              sizes=list(pool.map(get,range(1,605)))
          assert len(list(folder.glob('*.svg')))==604
          print('Retrieved immutable SVG verse geometry',len(sizes),'bytes',sum(sizes))
          PY
      - name: Build direct-touch maps with page / ayah canonical validation
        run: |
          cd src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          python3 tools/build_p45_verse_hitmaps.py \
            --svg-dir "$GITHUB_WORKSPACE/source_svg" \
            --dest app/src/main/assets/quran_verse_hitmaps \
            --quran-json app/src/main/assets/quran/quran-uthmani.json
          python3 <<'PY'
          import json,pathlib
          base=pathlib.Path('app/src/main/assets/quran_verse_hitmaps')
          assert len(list(base.glob('*.png')))==604
          assert len(list(base.glob('*.json')))==604
          expected={(x['page'],x['surah'],x['ayah']) for x in json.loads(pathlib.Path('app/src/main/assets/quran/quran-uthmani.json').read_text())}
          seen=set()
          for i in range(1,605):
              data=json.loads((base/f'{i:03d}.json').read_text())
              assert data['page']==i and data['edition']=='colored'
              found={(i,*pair) for pair in data['verses']}
              assert found and found<=expected
              seen |= found
          print('Map QA PASS; valid page-specific Ayahs:',len(seen),'canonical:',len(expected))
          assert len(seen)>=len(expected)*.98, 'Incomplete hit-mapped Quran text'
          PY
      - name: Build unsigned preview APK and Play AAB
        working-directory: src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
        run: |
          set -a
          . ../../configs/android_client_config.txt
          set +a
          gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease \
            -PKHATMA_FIREBASE_API_KEY="$KHATMA_FIREBASE_API_KEY" \
            -PKHATMA_FIREBASE_APP_ID="$KHATMA_FIREBASE_APP_ID" \
            -PKHATMA_GOOGLE_WEB_CLIENT_ID="$KHATMA_GOOGLE_WEB_CLIENT_ID" \
            -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app" \
            -PKHATMA_V2_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app"
      - name: Collect unsigned artifacts for local original signing
        run: |
          mkdir -p unsigned_build
          APK_PATH=$(find src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          AAB_PATH=$(find src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          test -n "$APK_PATH" && test -n "$AAB_PATH"
          cp "$APK_PATH" unsigned_build/P45_VC66_UNSIGNED.apk
          cp "$AAB_PATH" unsigned_build/P45_VC66_UNSIGNED_PLAY.aab
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" unsigned_build/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" unsigned_build/zipalign
          chmod +x unsigned_build/zipalign
          sha256sum unsigned_build/P45*
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P45-VC66-UNSIGNED-LOCAL-SIGNING
          path: unsigned_build/*
          if-no-files-found: error
          retention-days: 7
      - name: Archive complete P43 safe source with offline Quran
        run: |
          cd src
          zip -q -r -9 ../AB_Khatma_P45_VC66_COMPLETE_SAFE_SOURCE.zip AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE \
            -x '*/build/*' '*/.gradle/*' '*.p12' '*.jks' '*.keystore' '*.pyc' '*/__pycache__/*'
          unzip -t -q ../AB_Khatma_P45_VC66_COMPLETE_SAFE_SOURCE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P43-VC64-FULL-SAFE-SOURCE
          path: AB_Khatma_P45_VC66_COMPLETE_SAFE_SOURCE.zip
          if-no-files-found: error
          retention-days: 7
