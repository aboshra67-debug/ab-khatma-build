name: P48.1 VC70 Interface and Licensed Adhan Repair
on:
  push:
    branches: [release/p48-1-vc70-ui-adhan-fixes]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android SDK 36
        run: |
          TOOL=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$TOOL"
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare restricted CI source downloader
        run: |
          npm install --prefix /tmp/browser playwright
          /tmp/browser/node_modules/.bin/playwright install chromium
      - name: Reuse P47 tested source with original signed baseline and all Quran maps
        uses: actions/download-artifact@v4
        with:
          name: AB-Khatma-P47-VC68-FULL-SAFE-SOURCE
          run-id: 38261002602
          github-token: ${{ github.token }}
          repository: aboshra67-debug/ab-khatma-build
          path: baseline
      - name: Extract P47 source (no changes to audio or Quran)
        run: |
          test -s baseline/AB_Khatma_P47_VC68_COMPLETE_SAFE_SOURCE.zip
          mkdir -p src
          unzip -q baseline/AB_Khatma_P47_VC68_COMPLETE_SAFE_SOURCE.zip -d src
          test -d src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
      - name: Download same trusted Firebase public client settings (unchanged)
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('https://firestorage.ai/ja/f/nBo1EY9iX-PP',{waitUntil:'domcontentloaded',timeout:60000});
              const button=page.getByRole('button',{name:'ダウンロード',exact:true});
              await button.waitFor({state:'visible',timeout:60000});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),button.click()]);
              await download.saveAs('public_config.zip');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo '91fb83b2e7c315232e7f670074762fb7e0d22e06cc19da3cbea3b82cf501c411  public_config.zip' | sha256sum -c -
          mkdir -p configs
          unzip -q public_config.zip -d configs
      - name: Apply P48 strictly allowlisted code-only schedule patch
        run: |
          python3 p48/apply_p48.py src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
          test -f src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/src/main/res/raw/adhan_classic.ogg
          grep -q 'versionCode = 70' src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build.gradle.kts
      - name: Verify and bundle two licensed offline adhan recordings
        run: |
          set -euo pipefail
          AUDIO_DIR=src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/src/main/res/raw
          curl --fail -L --retry 3 --max-time 150 -sS -A 'ABKhatma/1.0 Audio' \
            'https://upload.wikimedia.org/wikipedia/commons/7/7c/33937_ejaz215_call-to-prayer-from-the-prophet-s-mo.ogg' \
            -o "$AUDIO_DIR/adhan_madinah.ogg"
          echo "4aa432b9e44804e7d72af4429bd743aa5fa9e3a4  $AUDIO_DIR/adhan_madinah.ogg" | sha1sum -c -
          curl --fail -L --retry 3 --max-time 180 -sS -A 'ABKhatma/1.0 Audio' \
            'https://upload.wikimedia.org/wikipedia/commons/4/4f/Adhan_in_Shalqar_mosque.webm' \
            -o /tmp/p48_1_shalqar.webm
          echo '5d7301c0c142d8e5d8f281f4dd02846eaf05529b  /tmp/p48_1_shalqar.webm' | sha1sum -c -
          ffmpeg -nostdin -hide_banner -loglevel error \
            -i /tmp/p48_1_shalqar.webm -map 0:a:0 -vn -c:a libvorbis -qscale:a 4 \
            "$AUDIO_DIR/adhan_shalqar.ogg"
          test "$(stat -c%s "$AUDIO_DIR/adhan_madinah.ogg")" -gt 1000000
          test "$(stat -c%s "$AUDIO_DIR/adhan_shalqar.ogg")" -gt 1000000
      - name: Build unsigned preview APK and Play AAB
        working-directory: src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE
        run: |
          set -a
          . ../../configs/android_client_config.txt
          set +a
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:bundleRelease \
            -PKHATMA_FIREBASE_API_KEY="$KHATMA_FIREBASE_API_KEY" \
            -PKHATMA_FIREBASE_APP_ID="$KHATMA_FIREBASE_APP_ID" \
            -PKHATMA_GOOGLE_WEB_CLIENT_ID="$KHATMA_GOOGLE_WEB_CLIENT_ID" \
            -PKHATMA_API_BASE_URL="https://balanced-creativity-production-f316.up.railway.app" \
            -PKHATMA_V2_API_BASE_URL="https://khatma-v2-api-staging.up.railway.app"
      - name: Collect unsigned artifacts for local original signing
        run: |
          mkdir -p unsigned_build
          APK_PATH=$(find src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          AAB_PATH=$(find src/AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          test -n "$APK_PATH" && test -n "$AAB_PATH"
          cp "$APK_PATH" unsigned_build/P48_1_VC70_UNSIGNED_RELEASE.apk
          cp "$AAB_PATH" unsigned_build/P48_1_VC70_UNSIGNED_PLAY.aab
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" unsigned_build/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" unsigned_build/zipalign
          chmod +x unsigned_build/zipalign
          sha256sum unsigned_build/P48*
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P48-1-VC70-UNSIGNED-LOCAL-SIGNING
          path: unsigned_build/*
          if-no-files-found: error
          retention-days: 7
      - name: Archive complete P48 safe source with original Quran and adhan
        run: |
          cd src
          zip -q -r -9 ../AB_Khatma_P48_1_VC70_COMPLETE_SAFE_SOURCE.zip AB_Khatma_P43_VC64_ZOOM_COLOR_SAFE_SOURCE \
            -x '*/build/*' '*/.gradle/*' '*.p12' '*.jks' '*.keystore' '*.pyc' '*/__pycache__/*'
          unzip -t -q ../AB_Khatma_P48_1_VC70_COMPLETE_SAFE_SOURCE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Khatma-P48-1-VC70-FULL-SAFE-SOURCE
          path: AB_Khatma_P48_1_VC70_COMPLETE_SAFE_SOURCE.zip
          if-no-files-found: error
          retention-days: 7
